# /etc/fail2ban/jail.local

[DEFAULT]
# Ban time in seconds (1 hour)
bantime = 3600
findtime = 600
maxretry = 5

[sshd]
enabled = true
port = ssh
logpath = /var/log/auth.log
backend = systemd

[nginx-limit-req]
enabled = true
port = http,https
logpath = /var/log/nginx/error.log
filter = nginx-limit-req
maxretry = 3
findtime = 600
bantime = 3600
